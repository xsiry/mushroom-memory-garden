server {
    listen 18088;
    server_name _;
    root /home/apps/mushroom-memory-garden/current;
    index index.html;
    server_tokens off;
    autoindex off;
    client_max_body_size 1m;

    access_log /var/log/nginx/mushroom-memory-garden.access.log main;
    error_log /var/log/nginx/mushroom-memory-garden.error.log warn;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(index\.html|styles\.css|build-info\.json|entry-qr\.(svg|png)|src/(app|dialogs|game|icons|qr|storage|views)\.js|assets/sprout\.svg|assets/mushrooms/[a-z-]+\.webp)$ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
